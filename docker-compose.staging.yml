# Staging overrides for saltrun-staging.
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Key differences from local:
#   - No MinIO service (uses existing MinIO on saltrun-staging)
#   - App port not published (Caddy terminates TLS and proxies internally)
#   - Worker uses named artifact volume on host

services:
  app:
    restart: always
    networks:
      - default
      - minio_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    restart: always
    networks:
      - default
      - minio_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: always

  redis:
    restart: always

  # MinIO is NOT deployed here — saltrun-staging already has MinIO running.
  # App and worker join minio_default network to reach MinIO at http://minio:9000
  minio:
    profiles:
      - disabled

networks:
  minio_default:
    external: true
