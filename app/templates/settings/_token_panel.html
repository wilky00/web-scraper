{# ABOUTME: Alpine.js panel for API token management on the settings page. #}
{# ABOUTME: Generate (POST /api/auth/token) and Revoke (DELETE /api/auth/token) without page reload for generate. #}
<div
    id="token-panel"
    x-data="{
        hasToken: {{ 'true' if has_api_token else 'false' }},
        plaintext: '',
        copied: false,
        loading: false,
        async generate() {
            this.loading = true;
            this.plaintext = '';
            this.copied = false;
            const resp = await fetch('/api/auth/token', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRF-Token': '{{ csrf_token }}'},
                body: JSON.stringify({scopes: ['records:read', 'records:write']})
            });
            this.loading = false;
            if (resp.ok) {
                const data = await resp.json();
                this.plaintext = data.token;
                this.hasToken = true;
            }
        },
        async revoke() {
            if (!confirm('Revoke your API token? Any scripts using it will stop working immediately.')) return;
            const resp = await fetch('/api/auth/token', {
                method: 'DELETE',
                headers: {'X-CSRF-Token': '{{ csrf_token }}'}
            });
            if (resp.ok) window.location.reload();
        },
        copy() {
            navigator.clipboard.writeText(this.plaintext);
            this.copied = true;
            setTimeout(() => this.copied = false, 2000);
        }
    }"
    class="space-y-4"
>
    <div class="flex items-center gap-3">
        <template x-if="hasToken">
            <span class="inline-flex items-center gap-1.5 rounded-full bg-green-100 dark:bg-green-900/30 px-2.5 py-0.5 text-xs font-medium text-green-700 dark:text-green-400">
                <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3"/></svg>
                Token active
            </span>
        </template>
        <template x-if="!hasToken">
            <span class="text-sm text-gray-500 dark:text-gray-400">No API token. Generate one to enable programmatic access.</span>
        </template>
    </div>

    <template x-if="plaintext">
        <div class="rounded-md border border-amber-300 dark:border-amber-700 bg-amber-50 dark:bg-amber-900/20 p-4 space-y-2">
            <p class="text-xs font-medium text-amber-800 dark:text-amber-300">Copy your token now — it will not be shown again.</p>
            <div class="flex items-center gap-2">
                <code
                    x-text="plaintext"
                    class="flex-1 overflow-x-auto rounded bg-white dark:bg-gray-900 border border-amber-200 dark:border-amber-700 px-3 py-1.5 text-xs font-mono text-gray-900 dark:text-gray-100"
                ></code>
                <button
                    type="button"
                    @click="copy()"
                    class="shrink-0 rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-1.5 text-xs font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    x-text="copied ? 'Copied!' : 'Copy'"
                    aria-live="polite"
                ></button>
            </div>
        </div>
    </template>

    <div class="flex items-center gap-3">
        <button
            type="button"
            @click="generate()"
            :disabled="loading"
            class="rounded-md bg-blue-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:bg-blue-500 dark:hover:bg-blue-600 dark:focus:ring-offset-gray-900 disabled:opacity-50"
            x-text="loading ? 'Generating…' : (hasToken ? 'Regenerate token' : 'Generate token')"
        ></button>

        <template x-if="hasToken">
            <button
                type="button"
                @click="revoke()"
                class="rounded-md border border-red-300 dark:border-red-700 px-3 py-1.5 text-sm font-medium text-red-700 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
            >
                Revoke
            </button>
        </template>
    </div>
</div>
