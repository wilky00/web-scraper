{% if versions %}
<ul class="divide-y divide-gray-100 dark:divide-gray-700/50">
    {% for v in versions %}
    <li class="px-4 py-3 {% if loop.first %}bg-blue-50/50 dark:bg-blue-900/10{% endif %}">
        <div class="flex items-start justify-between gap-2">
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="text-sm font-semibold text-gray-900 dark:text-gray-100">v{{ v.version }}</span>
                    {% if loop.first %}
                    <span class="inline-flex items-center rounded px-1.5 py-0.5 text-xs font-medium bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300">latest</span>
                    {% endif %}
                </div>
                <p class="mt-0.5 text-xs text-gray-400 dark:text-gray-500">
                    {{ v.created_at.strftime('%Y-%m-%d %H:%M') if v.created_at else '—' }}
                </p>
            </div>
            <button type="button"
                    onclick="loadVersion('{{ group_id }}', '{{ v.id }}')"
                    class="flex-shrink-0 text-xs text-blue-600 dark:text-blue-400 hover:underline"
                    aria-label="Load version {{ v.version }}">Load</button>
        </div>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="px-4 py-6 text-center">
    <p class="text-sm text-gray-400 dark:text-gray-500">No versions found.</p>
</div>
{% endif %}
