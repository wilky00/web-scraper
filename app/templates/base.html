<!DOCTYPE html>
<html lang="en" x-data x-bind:class="{ 'dark': $store.theme.dark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Web Scraper{% endblock %}</title>
    <!-- Tailwind Play CDN — replace with compiled output before production -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('theme', {
                dark: localStorage.getItem('theme') !== null
                    ? localStorage.getItem('theme') === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches,
                toggle() {
                    this.dark = !this.dark;
                    localStorage.setItem('theme', this.dark ? 'dark' : 'light');
                }
            });
        });
    </script>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased">

    {% if csrf_token is defined and csrf_token %}
    <!-- Top nav — only rendered for authenticated pages that pass csrf_token -->
    <nav class="border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900/80 backdrop-blur-sm sticky top-0 z-10">
        <div class="mx-auto max-w-6xl px-8 flex items-center justify-between h-14">
            <div class="flex items-center gap-6">
                <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity flex-shrink-0" aria-label="Scrapy home">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 flex-shrink-0" aria-hidden="true">
                        <defs>
                            <linearGradient id="scrapy-logo-g" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#818cf8"/>
                                <stop offset="100%" stop-color="#4338ca"/>
                            </linearGradient>
                        </defs>
                        <!-- Arc circle — gap at upper-right (~53°) -->
                        <circle cx="20" cy="20" r="14"
                                stroke="url(#scrapy-logo-g)"
                                stroke-width="2.5"
                                stroke-dasharray="75 13"
                                stroke-linecap="round"
                                fill="none"/>
                        <!-- Pivot dot at center -->
                        <circle cx="20" cy="20" r="2" fill="#818cf8"/>
                        <!-- Cap dot at arc end (~1:30 o'clock) -->
                        <circle cx="29" cy="9" r="2" fill="#818cf8"/>
                        <!-- Compass needle pointing NE -->
                        <path d="M29 9 L13 25 L21 17 Z" fill="#4338ca"/>
                        <!-- Comet trail dots -->
                        <circle cx="13" cy="27" r="1.5" fill="#94a3b8" opacity="0.75"/>
                        <circle cx="7" cy="34" r="2.5" fill="#94a3b8"/>
                    </svg>
                    <span class="text-lg font-bold text-gray-900 dark:text-white tracking-tight">Scrapy</span>
                </a>
                <div class="hidden sm:flex items-center gap-1">
                    <a
                        href="/"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path == '/' %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Dashboard</a>
                    <a
                        href="/projects"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path.startswith('/projects') %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Projects</a>
                    <a
                        href="/criteria/new"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path.startswith('/criteria') %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Criteria</a>
                    <a
                        href="/jobs"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path.startswith('/jobs') %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Jobs</a>
                    <a
                        href="/records"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path.startswith('/records') %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Records</a>
                    <a
                        href="/exports"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path.startswith('/exports') %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Exports</a>
                    <a
                        href="/audit-log"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path.startswith('/audit-log') %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Audit Log</a>
                    <a
                        href="/settings"
                        class="rounded-md px-3 py-1.5 text-sm font-medium {% if request.url.path.startswith('/settings') %}text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20{% else %}text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-gray-100{% endif %}"
                    >Settings</a>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button
                    x-data
                    @click="$store.theme.toggle()"
                    type="button"
                    aria-label="Toggle light/dark mode"
                    class="rounded-md p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
                    <svg x-show="!$store.theme.dark" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg x-show="$store.theme.dark" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
                <form method="post" action="/auth/logout">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button
                        type="submit"
                        class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 focus:outline-none focus:underline"
                    >
                        Sign out
                    </button>
                </form>
            </div>
        </div>
    </nav>
    {% else %}
    <!-- Unauthenticated page — no nav -->
    {% endif %}

    <main>
    {% block content %}{% endblock %}
    </main>
</body>
</html>
