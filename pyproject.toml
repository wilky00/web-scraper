[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "web-scraper"
version = "0.1.0"
description = "Configurable internal web scraper for business record discovery"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.18.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "redis>=5.0.0",
    "rq>=2.8.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "boto3>=1.34.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "tenacity>=9.1.4",
    "bleach>=6.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.0",
    "authlib>=1.7.2",
    "pyyaml>=6.0.3",
    "asyncpg>=0.29.0",
    "greenlet>=3.5.0",
    "playwright>=1.60.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.13",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-playwright>=0.5.0",
    "types-bleach>=6.1.0",
    "types-beautifulsoup4>=4.12.0",
    "types-passlib>=1.7.7",
    "types-pyyaml>=6.0.12",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
# FastAPI uses Depends() in function signatures, which B008 flags as a false positive
"app/web/*.py" = ["B008"]
"app/api/*.py" = ["B008"]
# YAML template strings inside seed.py legitimately exceed 100 chars
"app/criteria/seed.py" = ["E501"]
# SQLAlchemy Column() calls in migrations are intentionally wide
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["passlib.*", "rq.*", "redis.*", "boto3.*", "botocore.*", "bleach.*", "authlib.*", "bs4.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
markers = [
    "e2e: end-to-end UAT tests against a live environment (requires E2E_BASE_URL env var)",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
